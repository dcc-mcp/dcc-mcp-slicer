      _meta:
        type: object
    additionalProperties: false
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context:
            type: object
            properties:
              execution_thread_id: *id001
              main_thread_id: *id001
              node: *id005
            required:
            - execution_thread_id
            - main_thread_id
            - node
            additionalProperties: false
  execution: sync
  affinity: main
  requires_in_process: true
  enforce_thread_affinity: true
  timeout_hint_secs: 15
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
  next-tools:
    on-failure:
    - scene_info
- name: edit_sphere
  description: Replace synthetic sphere geometry and set its display color and opacity.
  source_file: scripts/edit_sphere.py
  input_schema:
    type: object
    properties:
      node_id: &id006
        type: string
        minLength: 1
        maxLength: 128
      radius:
        type: number
        minimum: 0.01
        maximum: 1000
        default: 12
      red:
        type: number
        minimum: 0
        maximum: 1
        default: 0.2
      green:
        type: number
        minimum: 0
        maximum: 1
        default: 0.7
      blue:
        type: number
        minimum: 0
        maximum: 1
        default: 0.9
      opacity:
        type: number
        minimum: 0
        maximum: 1
        default: 1
      expected_revision:
        type: string
        pattern: ^[0-9a-f]{64}$
        description: Optional optimistic concurrency guard from the most recent node
          readback.
    required:
    - node_id
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      prompt:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type: object
      _meta:
        type: object
    additionalProperties: false
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context:
            type: object
            properties:
              execution_thread_id: *id001
              main_thread_id: *id001
              node: *id005
            required:
            - execution_thread_id
            - main_thread_id
            - node
            additionalProperties: false
  execution: sync
  affinity: main
  requires_in_process: true
  enforce_thread_affinity: true
  timeout_hint_secs: 15
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: true
    open_world_hint: false
  next-tools:
    on-failure:
    - scene_info
- name: export_node
  description: Export a synthetic volume as NRRD or sphere as STL without replacing
    files.
  source_file: scripts/export_node.py
  input_schema:
    type: object
    properties:
      node_id: *id006
      filename:
        type: string
        pattern: ^[A-Za-z0-9_-]{1,80}\.(nrrd|stl)$
      expected_revision:
        type: string
        pattern: ^[0-9a-f]{64}$
        description: Optional optimistic concurrency guard from the most recent node
          readback.
    required:
    - node_id
    - filename
    additionalProperties: false
  output_schema:
    type: object
    anyOf:
    - type: object
      required:
      - success
      - message
      - error
      - context
      properties:
        success:
          type: boolean
        message:
          type: string
        error:
          type:
          - string
          - 'null'
        prompt:
          type:
          - string
          - 'null'
        context:
          type: object
        postcondition:
          type: object
        _meta:
          type: object
      additionalProperties: false
      allOf:
      - if:
          properties:
            success:
              const: true
        then:
          properties:
            context:
              type: object
              properties:
                execution_thread_id: *id001
                main_thread_id: *id001
                filename: *id002
                bytes: &id007
                  type: integer
                  minimum: 1
                  maximum: 268435456
                sha256: &id008
                  type: string
                  pattern: ^[0-9a-f]{64}$
                node: *id005
              required:
              - execution_thread_id
              - main_thread_id
              - filename
              - bytes
              - sha256
              - node
              additionalProperties: false
    - type: object
      required:
      - job_id
      - status
      properties:
        job_id:
          type: string
        status:
          type: string
          enum:
          - pending
          - running
          - completed
          - failed
          - cancelled
          - interrupted
        success:
          type: boolean
        message:
          type: string
        error:
          type:
          - string
          - 'null'
      additionalProperties: true
  execution: async
  affinity: main
  requires_in_process: true
  enforce_thread_affinity: true
  timeout_hint_secs: 120
  annotations:
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
  job_strategy: monolithic
  next-tools:
    on-failure:
    - scene_info
