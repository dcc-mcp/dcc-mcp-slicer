tools:
- name: scene_info
  description: Inspect bounded metadata for adapter-created synthetic nodes.
  source_file: scripts/scene_info.py
  input_schema:
    type: object
    properties:
      limit:
        type: integer
        minimum: 1
        maximum: 100
        default: 100
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      prompt:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type: object
      _meta:
        type: object
    additionalProperties: false
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context:
            type: object
            properties:
              execution_thread_id: &id001
                type: integer
              main_thread_id: *id001
              application_version: &id002
                type: string
              nodes:
                type: array
                items: &id005
                  type: object
                  oneOf:
                  - type: object
                    properties:
                      node_id: *id002
                      name: *id002
                      kind:
                        const: volume
                      revision: &id004
                        type: string
                        pattern: ^[0-9a-f]{64}$
                      dimensions:
                        type: array
                        items: *id001
                        minItems: 3
                        maxItems: 3
                      spacing:
                        type: array
                        items: &id003
                          type: number
                        minItems: 3
                        maxItems: 3
                      origin:
                        type: array
                        items: *id003
                        minItems: 3
                        maxItems: 3
                      scalar_range:
                        type: array
                        items: *id003
                        minItems: 2
                        maxItems: 2
                    required:
                    - node_id
                    - name
                    - kind
                    - revision
                    - dimensions
                    - spacing
                    - origin
                    - scalar_range
                    additionalProperties: false
                  - type: object
                    properties:
                      node_id: *id002
                      name: *id002
                      kind:
                        const: sphere
                      revision: *id004
                      points: *id001
                      cells: *id001
                      bounds:
                        type: array
                        items: *id003
                        minItems: 6
                        maxItems: 6
                      color:
                        type: array
                        items: *id003
                        minItems: 3
                        maxItems: 3
                      opacity: *id003
                    required:
                    - node_id
                    - name
                    - kind
                    - revision
                    - points
                    - cells
                    - bounds
                    - color
                    - opacity
                    additionalProperties: false
                maxItems: 100
              count: *id001
              truncated: &id009
                type: boolean
            required:
            - execution_thread_id
            - main_thread_id
            - application_version
            - nodes
            - count
            - truncated
            additionalProperties: false
  execution: sync
  affinity: main
  requires_in_process: true
  enforce_thread_affinity: true
  timeout_hint_secs: 15
  annotations:
    read_only_hint: true
    destructive_hint: false
    idempotent_hint: true
    open_world_hint: false
- name: create_volume
  description: Create an int16 mathematical sphere volume, bounded to 128 cubed voxels.
  source_file: scripts/create_volume.py
  input_schema:
    type: object
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9 _-]+$
        default: Synthetic volume
      size:
        type: integer
        minimum: 8
        maximum: 128
        default: 32
      spacing:
        type: number
        minimum: 0.01
        maximum: 100
        default: 1
      value:
        type: integer
        minimum: 1
        maximum: 32767
        default: 120
    required: []
    additionalProperties: false
  output_schema:
    type: object
    required:
    - success
    - message
    - error
    - context
    properties:
      success:
        type: boolean
      message:
        type: string
      error:
        type:
        - string
        - 'null'
      prompt:
        type:
        - string
        - 'null'
      context:
        type: object
      postcondition:
        type: object
      _meta:
        type: object
    additionalProperties: false
    allOf:
    - if:
        properties:
          success:
            const: true
      then:
        properties:
          context:
            type: object
            properties:
              execution_thread_id: *id001
              main_thread_id: *id001
              node: *id005
              scalar_range:
                type: array
                items: *id003
                minItems: 2
                maxItems: 2
            required:
            - execution_thread_id
            - main_thread_id
            - node
            - scalar_range
            additionalProperties: false
  execution: sync
  affinity: main
  requires_in_process: true
  enforce_thread_affinity: true
  timeout_hint_secs: 15
  annotations: &id010
    read_only_hint: false
    destructive_hint: true
    idempotent_hint: false
    open_world_hint: false
  next-tools: &id011
    on-failure:
    - scene_info
- name: create_sphere
