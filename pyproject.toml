[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dcc-mcp-slicer"
version = "0.1.0"
description = "Typed DCC-MCP adapter for synthetic scenes in 3D Slicer"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["dcc-mcp-core==0.20.41", "dcc-mcp-server==0.20.41"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11", "build>=1.2", "PyYAML>=6", "jsonschema>=4.18", "mcp==1.30.0"]

[project.entry-points."dcc_mcp.adapters"]
slicer = "dcc_mcp_slicer.server:SlicerMcpServer"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_mcp_slicer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
